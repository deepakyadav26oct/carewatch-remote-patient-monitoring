services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: carewatch, POSTGRES_PASSWORD: carewatch, POSTGRES_DB: carewatch}
    volumes: ["pgdata:/var/lib/postgresql/data", "./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U carewatch"], interval: 5s, retries: 10}
  api:
    build: ./backend
    env_file: ./backend/.env.example
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
